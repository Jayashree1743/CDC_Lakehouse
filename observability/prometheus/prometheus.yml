# =============================================================================
# DAY 6 - PROMETHEUS config
# =============================================================================
# Prometheus PULLS metrics from each service's /metrics endpoint (the
# "Prometheus exposition format"). We scrape three jobs:
#   silver     :8001  - CDC event counters, DLQ depth, replication lag (Spark)
#   vector-sync:8002  - chunks/tokens embedded, sync runs, qdrant lag
#   api        :8000  - request counters (Day 5)
global:
  scrape_interval: 5s          # lab-fast; prod is usually 15-60s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: silver
    static_configs: [{ targets: ["host.docker.internal:8001"] }]
  - job_name: vector-sync
    static_configs: [{ targets: ["host.docker.internal:8002"] }]
  - job_name: api
    static_configs: [{ targets: ["host.docker.internal:8000"] }]
